<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zipasaurus 3D Assets - Blender models and 3D artwork">
    <link rel="icon" type="image/x-icon" href="/images/PageIcon.ico">
    <title>3D Assets 🧊 | Zipasaurus</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
   
    <style>
        :root {
            --accent: #00ff41;
            --accent-glow: #00ff4180;
            --bg: #0a0f0a;
            --surface: rgba(20, 30, 20, 0.88);
            --text: #e0ffe0;
            --text-muted: #a0c0a0;
            --shadow: 0 10px 30px rgba(0, 255, 65, 0.15);
        }
       
        [data-theme="light"] {
            --bg: #f0f7f0;
            --surface: rgba(255, 255, 255, 0.92);
            --text: #1a2a1a;
            --text-muted: #445544;
            --accent: #00cc33;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .retro-font {
            font-family: 'Press Start 2P', sans-serif;
            letter-spacing: 2px;
        }

        /* SIDEBAR NAV */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 360px;
            background: rgba(10, 15, 10, 0.98);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(0, 255, 65, 0.2);
            z-index: 1000;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            transition: color 0.3s;
            margin-bottom: 2rem;
            text-align: center;
            text-decoration: none;
        }
        .logo:hover { color: #00ff60; }

        .sidebar nav ul {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            list-style: none;
            flex-grow: 1;
        }

        .sidebar nav ul li a {
            color: var(--text);
            text-decoration: none;
            padding: 1rem 1.4rem;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid rgba(0, 255, 65, 0.3);
            background: rgba(0, 255, 65, 0.05);
            display: block;
        }

        .sidebar nav ul li a:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 65, 0.15);
            color: var(--accent);
            transform: translateX(8px);
        }

        .sidebar nav ul li a.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #000;
        }

        /* Main Content */
        main {
            margin-left: 360px;
            min-height: 100vh;
        }

        /* Hero */
        .hero {
            min-height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,255,65,0.03) 1px, transparent 1px),
                        linear-gradient(to right, rgba(0,255,65,0.03) 1px, transparent 1px);
            background-size: 70px 70px;
            pointer-events: none;
            z-index: -1;
        }
        .hero::after {
            content: '🧊';
            position: absolute;
            font-size: 25vw;
            opacity: 0.08;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            user-select: none;
        }
        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .hero-content p {
            font-size: 1.2rem;
            max-width: 620px;
            margin: 0 auto;
            color: var(--text-muted);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,255,65,0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 2.3rem;
            margin-bottom: 1.5rem;
            color: var(--accent);
        }

        /* 3D Assets Grid */
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        .asset-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
        }

        .asset-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 255, 65, 0.2);
            border-color: var(--accent);
        }

        /* 3D Model Viewer inside each card */
        .asset-card model-viewer {
            width: 100%;
            height: 320px;
            background: radial-gradient(circle at center, #1a251a 0%, #0a0f0a 100%);
            --poster-color: transparent;
        }

        .asset-card model-viewer::part(default-progress-bar) {
            background-color: var(--accent);
            height: 3px;
        }

        .asset-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .asset-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .asset-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .asset-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 255, 65, 0.15);
        }

        .asset-btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .asset-btn:hover {
            background: var(--accent);
            color: #000;
        }

        /* Wireframe Modal */
        .wireframe-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .wireframe-modal.active {
            display: flex;
        }

        .wireframe-container {
            width: 90%;
            max-width: 900px;
            height: 80vh;
            background: var(--surface);
            border: 2px solid var(--accent);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .wireframe-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            background: rgba(10, 15, 10, 0.95);
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .wireframe-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .wireframe-close {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .wireframe-close:hover {
            background: var(--accent);
            color: #000;
        }

        #wireframe-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Mobile */
        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
                padding: 1.5rem 0.8rem;
                align-items: center;
            }
            .logo {
                font-size: 0.9rem;
                writing-mode: vertical-rl;
                text-orientation: mixed;
                margin-bottom: 3rem;
                transform: rotate(180deg);
            }
            .sidebar nav ul li a {
                padding: 1rem 0.8rem;
                text-align: center;
                font-size: 0.85rem;
            }
            .sidebar nav ul li a span {
                display: none;
            }
            main {
                margin-left: 80px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.4s ease;
            }
            .sidebar.active {
                transform: translateX(0);
            }
            main {
                margin-left: 0;
            }
            .hamburger {
                display: block;
                position: fixed;
                top: 1.2rem;
                left: 1.2rem;
                font-size: 2rem;
                z-index: 1100;
                background: rgba(10,15,10,0.9);
                border: 2px solid var(--accent);
                border-radius: 50%;
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            .assets-grid { grid-template-columns: 1fr; }
            .asset-card model-viewer { height: 280px; }
            .hero-content h1 { font-size: 2.5rem; }
            .wireframe-container { width: 95%; height: 70vh; }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <a href="index.html" class="logo retro-font">ZIPASAURUS 🦖</a>
        
        <nav>
            <ul>
                <li><a href="index.html" class="nav-item">About</a></li>
                <li><a href="Projects.html" class="nav-item">Projects</a></li>
                <li><a href="Setup.html" class="nav-item">Setup</a></li>
                <li><a href="Socials.html" class="nav-item">Socials</a></li>
                <li><a href="Gallery.html" class="nav-item">Gallery</a></li>
                <li><a href="dj.html" class="nav-item">DJ Zone</a></li>
                <li><a href="GDD.html" class="nav-item">GDD</a></li>
                <li><a href="assets.html" class="nav-item active">3D Assets</a></li>
                <li><a href="watchlist.html" class="nav-item">Watchlist</a></li>
                <li><a href="NoteTaker/index.html" class="nav-item">GameideaGen + Planner</a></li>
            </ul>
        </nav>
    </div>

    <!-- Hamburger for mobile -->
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation">☰</button>

    <main>
        <!-- HERO -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="retro-font">🧊 3D ASSETS</h1>
                <p>Interactive 3D models created in Blender. Drag to rotate, scroll to zoom.</p>
            </div>
        </section>

        <div class="container">
            <div class="card">
                <h2>My Models</h2>

                <div class="assets-grid">

                    <!-- ASSET 1 -->
                    <div class="asset-card">
                        <model-viewer
                            src="models/Tree.glb"
                            alt="Tree"
                            auto-rotate
                            camera-controls
                            shadow-intensity="1"
                            interaction-prompt="none">
                        </model-viewer>
                        <div class="asset-info">
                            <h3 class="asset-title">Tree</h3>
                            <p class="asset-desc">TestTree</p>
                            <div class="asset-actions">
                                <button class="asset-btn" onclick="openWireframe('models/Tree.glb', 'Tree')">🔺 Wireframe</button>
                            </div>
                        </div>
                    </div>

        </div>
    </main>

    <!-- Wireframe Modal -->
    <div class="wireframe-modal" id="wireframe-modal">
        <div class="wireframe-container">
            <div class="wireframe-header">
                <div class="wireframe-title" id="wireframe-title">Wireframe View</div>
                <button class="wireframe-close" onclick="closeWireframe()">×</button>
            </div>
            <canvas id="wireframe-canvas"></canvas>
        </div>
    </div>

<script>
    // Mobile hamburger
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');

    hamburger.addEventListener('click', () => {
        sidebar.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768 && 
            !sidebar.contains(e.target) && 
            e.target !== hamburger) {
            sidebar.classList.remove('active');
        }
    });

    // Wireframe Viewer
    let wireframeScene, wireframeCamera, wireframeRenderer, wireframeControls;
    let wireframeAnimationId;

    function openWireframe(modelUrl, modelName) {
        document.getElementById('wireframe-modal').classList.add('active');
        document.getElementById('wireframe-title').textContent = modelName + ' - Wireframe';
        document.body.style.overflow = 'hidden';

        const canvas = document.getElementById('wireframe-canvas');
        const container = canvas.parentElement;

        // Setup Three.js
        wireframeScene = new THREE.Scene();
        wireframeScene.background = new THREE.Color(0x0a0f0a);

        wireframeCamera = new THREE.PerspectiveCamera(
            45,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        wireframeCamera.position.set(3, 2, 5);

        wireframeRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        wireframeRenderer.setSize(container.clientWidth, container.clientHeight);
        wireframeRenderer.setPixelRatio(window.devicePixelRatio);

        // Controls
        wireframeControls = new THREE.OrbitControls(wireframeCamera, wireframeRenderer.domElement);
        wireframeControls.enableDamping = true;
        wireframeControls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        wireframeScene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ff41, 1);
        dirLight.position.set(5, 10, 7);
        wireframeScene.add(dirLight);

        // Grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x00ff41, 0x1a251a);
        wireframeScene.add(gridHelper);

        // Load model
        const loader = new THREE.GLTFLoader();
        loader.load(modelUrl, function(gltf) {
            const model = gltf.scene;
            
            // Auto-center and scale
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3 / maxDim;
            model.scale.setScalar(scale);
            model.position.sub(center.multiplyScalar(scale));
            model.position.y += (size.y * scale) / 2;

            // Apply wireframe material to all meshes
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshBasicMaterial({
                        color: 0x00ff41,
                        wireframe: true
                    });
                }
            });

            wireframeScene.add(model);
        });

        // Animation loop
        function animate() {
            wireframeAnimationId = requestAnimationFrame(animate);
            wireframeControls.update();
            wireframeRenderer.render(wireframeScene, wireframeCamera);
        }
        animate();

        // Handle resize
        window.addEventListener('resize', handleWireframeResize);
    }

    function handleWireframeResize() {
        if (!wireframeRenderer) return;
        const container = document.getElementById('wireframe-canvas').parentElement;
        wireframeCamera.aspect = container.clientWidth / container.clientHeight;
        wireframeCamera.updateProjectionMatrix();
        wireframeRenderer.setSize(container.clientWidth, container.clientHeight);
    }

    function closeWireframe() {
        document.getElementById('wireframe-modal').classList.remove('active');
        document.body.style.overflow = '';
        
        if (wireframeAnimationId) {
            cancelAnimationFrame(wireframeAnimationId);
        }
        
        if (wireframeRenderer) {
            wireframeRenderer.dispose();
        }
        
        window.removeEventListener('resize', handleWireframeResize);
        
        wireframeScene = null;
        wireframeCamera = null;
        wireframeRenderer = null;
        wireframeControls = null;
    }

    // Close on escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('wireframe-modal').classList.contains('active')) {
            closeWireframe();
        }
    });
</script>
</body>
</html>
