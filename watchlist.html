<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zipasaurus Watchlist - Movies, Series, and Animations I've watched">
    <link rel="icon" type="image/x-icon" href="/images/PageIcon.ico">
    <title>Watchlist 🎬 | Zipasaurus</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
   
    <style>
        :root {
            --accent: #00ff41;
            --accent-glow: #00ff4180;
            --bg: #0a0f0a;
            --surface: rgba(20, 30, 20, 0.88);
            --text: #e0ffe0;
            --text-muted: #a0c0a0;
            --shadow: 0 10px 30px rgba(0, 255, 65, 0.15);
        }
       
        [data-theme="light"] {
            --bg: #f0f7f0;
            --surface: rgba(255, 255, 255, 0.92);
            --text: #1a2a1a;
            --text-muted: #445544;
            --accent: #00cc33;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .retro-font {
            font-family: 'Press Start 2P', sans-serif;
            letter-spacing: 2px;
        }

        /* SIDEBAR NAV */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 360px;
            background: rgba(10, 15, 10, 0.98);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(0, 255, 65, 0.2);
            z-index: 1000;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            transition: color 0.3s;
            margin-bottom: 2rem;
            text-align: center;
            text-decoration: none;
        }
        .logo:hover { color: #00ff60; }

        .sidebar nav ul {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            list-style: none;
            flex-grow: 1;
        }

        .sidebar nav ul li a {
            color: var(--text);
            text-decoration: none;
            padding: 1rem 1.4rem;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid rgba(0, 255, 65, 0.3);
            background: rgba(0, 255, 65, 0.05);
            display: block;
        }

        .sidebar nav ul li a:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 65, 0.15);
            color: var(--accent);
            transform: translateX(8px);
        }

        .sidebar nav ul li a.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #000;
        }

        /* Main Content */
        main {
            margin-left: 360px;
            min-height: 100vh;
        }

        /* Hero */
        .hero {
            min-height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,255,65,0.03) 1px, transparent 1px),
                        linear-gradient(to right, rgba(0,255,65,0.03) 1px, transparent 1px);
            background-size: 70px 70px;
            pointer-events: none;
            z-index: -1;
        }
        .hero::after {
            content: '🎬';
            position: absolute;
            font-size: 25vw;
            opacity: 0.08;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            user-select: none;
        }
        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .hero-content p {
            font-size: 1.2rem;
            max-width: 620px;
            margin: 0 auto;
            color: var(--text-muted);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,255,65,0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        h2 {
            font-size: 2.3rem;
            margin-bottom: 1.5rem;
            color: var(--accent);
        }

        /* Watchlist Styles */
        .watchlist-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .watchlist-tab {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .watchlist-tab:hover {
            background: rgba(0, 255, 65, 0.1);
            transform: translateY(-2px);
        }

        .watchlist-tab.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .watchlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        .watchlist-item {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
        }

        .watchlist-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 255, 65, 0.2);
            border-color: var(--accent);
        }

        .watchlist-image {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .watchlist-item:hover .watchlist-image {
            transform: scale(1.03);
        }

        .watchlist-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .watchlist-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .watchlist-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .watchlist-year {
            color: var(--text-muted);
        }

        .watchlist-rating {
            color: var(--accent);
            font-weight: 700;
        }

        .watchlist-review-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            border-top: 1px solid rgba(0, 255, 65, 0.15);
            padding-top: 0.8rem;
            margin-top: auto;
        }

        .watchlist-review-hint::before {
            content: "📝 ";
        }

        /* Watchlist Modal */
        .wl-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            padding: 2rem;
        }

        .wl-modal-overlay.active {
            display: flex;
        }

        .wl-modal {
            background: var(--surface);
            border: 2px solid var(--accent);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 255, 65, 0.2);
            position: relative;
            animation: wlModalIn 0.3s ease;
        }

        @keyframes wlModalIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .wl-modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s;
        }

        .wl-modal-close:hover {
            background: var(--accent);
            color: #000;
        }

        .wl-modal-img-wrap {
            width: 100%;
            max-height: 350px;
            overflow: hidden;
            border-radius: 14px 14px 0 0;
        }

        .wl-modal-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .wl-modal-body {
            padding: 2rem;
        }

        .wl-modal-body h3 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .wl-modal-meta {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .wl-modal-review {
            border-top: 1px solid rgba(0, 255, 65, 0.15);
            padding-top: 1.5rem;
        }

        .wl-modal-review h4 {
            color: var(--text);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .wl-modal-review p {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 1rem;
        }

        /* Mobile */
        @media (max-width: 992px) {
            .sidebar {
                width: 80px;
                padding: 1.5rem 0.8rem;
                align-items: center;
            }
            .logo {
                font-size: 0.9rem;
                writing-mode: vertical-rl;
                text-orientation: mixed;
                margin-bottom: 3rem;
                transform: rotate(180deg);
            }
            .sidebar nav ul li a {
                padding: 1rem 0.8rem;
                text-align: center;
                font-size: 0.85rem;
            }
            .sidebar nav ul li a span {
                display: none;
            }
            main {
                margin-left: 80px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.4s ease;
            }
            .sidebar.active {
                transform: translateX(0);
            }
            main {
                margin-left: 0;
            }
            .hamburger {
                display: block;
                position: fixed;
                top: 1.2rem;
                left: 1.2rem;
                font-size: 2rem;
                z-index: 1100;
                background: rgba(10,15,10,0.9);
                border: 2px solid var(--accent);
                border-radius: 50%;
                width: 50px;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }
            .watchlist-grid { grid-template-columns: 1fr; }
            .watchlist-image { height: 300px; }
            .wl-modal { max-height: 90vh; }
            .wl-modal-body { padding: 1.2rem; }
            .hero-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <a href="index.html" class="logo retro-font">ZIPASAURUS 🦖</a>
        
        <nav>
            <ul>
                <li><a href="index.html" class="nav-item">About</a></li>
                <li><a href="Projects.html" class="nav-item">Projects</a></li>
                <li><a href="Setup.html" class="nav-item">Setup</a></li>
                <li><a href="Socials.html" class="nav-item">Socials</a></li>
                <li><a href="Gallery.html" class="nav-item">Gallery</a></li>
                <li><a href="dj.html" class="nav-item">DJ Zone</a></li>
                <li><a href="GDD.html" class="nav-item">GDD</a></li>
                <li><a href="assets.html" class="nav-item active">3D Assets</a></li>
                <li><a href="watchlist.html" class="nav-item">Watchlist</a></li>
                <li><a href="NoteTaker/index.html" class="nav-item">GameideaGen + Planner</a></li>
            </ul>
        </nav>
    </div>

    <!-- Hamburger for mobile -->
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation">☰</button>

    <main>
        <!-- HERO -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="retro-font">🎬 WATCHLIST</h1>
                <p>My personal ratings & reviews for everything I've watched</p>
            </div>
        </section>

        <div class="container">
            <div class="card">
                <!-- Tabs -->
                <div class="watchlist-tabs">
                    <button class="watchlist-tab active" data-tab="movies" onclick="switchWatchlistTab('movies')">Movies</button>
                    <button class="watchlist-tab" data-tab="series" onclick="switchWatchlistTab('series')">Series</button>
                    <button class="watchlist-tab" data-tab="animations" onclick="switchWatchlistTab('animations')">Animations</button>
                </div>

                <!-- Content Grid -->
                <div id="watchlist-content" class="watchlist-grid">
                    <!-- Content will be dynamically loaded -->
                </div>
            </div>
        </div>
    </main>

<script>
    // Mobile hamburger
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');

    hamburger.addEventListener('click', () => {
        sidebar.classList.toggle('active');
    });

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768 && 
            !sidebar.contains(e.target) && 
            e.target !== hamburger) {
            sidebar.classList.remove('active');
        }
    });

    // ===== WATCHLIST DATA & FUNCTIONS =====
    const watchlistData = {
        movies: [
            {
                title: "Tetris",
                year: 2023,
                rating: "10/10",
                image: "https://image.tmdb.org/t/p/w600_and_h900_face/4F2QwCOYHJJjecSvdOjStuVLkpu.jpg",
                review: "I seen short after short on Tetris, and I can see why. This movie truly outdid itself!"
            }
            // Copy the above block and paste it here to add new movies. It will auto-sort itself!
        ],
        series: [
            {
                title: "The Boys",
                year: 2019,
                rating: "9.5/10",
                image: "https://image.tmdb.org/t/p/w600_and_h900_face/in1R2dDc421JxsoRWaIIAqVI2KE.jpg",
                review: "Just an amazing watch, was recommended by a friend, some moments are... interesting, but overall. Great show!"
            }
            // Copy the above block and paste it here to add new series.
        ],
        animations: [
            {
                title: "Initial D (頭文字D)",
                year: 1998,
                rating: "10/10",
                image: "https://image.tmdb.org/t/p/w600_and_h900_face/2TRN7AXN4rRJNIf1TLgIGRVlQZB.jpg",
                review: "If you've seen the anime, you know exactly what should be put here."
            }
            // Copy the above block and paste it here to add new animations.
        ]
    };

    let currentWatchlistTab = 'movies';

    function switchWatchlistTab(tab) {
        currentWatchlistTab = tab;
        
        // Update active tab UI
        document.querySelectorAll('.watchlist-tab').forEach(t => {
            t.classList.remove('active');
            if (t.getAttribute('data-tab') === tab) {
                t.classList.add('active');
            }
        });
        
        renderWatchlist();
    }

    function renderWatchlist() {
        const container = document.getElementById('watchlist-content');
        const items = watchlistData[currentWatchlistTab];
        
        if (!items || items.length === 0) {
            container.innerHTML = `<div style="grid-column: 1/-1; padding: 3rem; text-align: center; color: var(--text-muted);">
                <p>No items in this category yet. 🍿</p>
            </div>`;
            return;
        }
        
        container.innerHTML = items.map((item, index) => `
            <div class="watchlist-item" onclick="showReview('${currentWatchlistTab}', ${index})">
                <img src="${item.image}" alt="${item.title}" class="watchlist-image" onerror="this.src='https://via.placeholder.com/400x600/0a0f0a/00ff41?text=${encodeURIComponent(item.title)}'">
                <div class="watchlist-info">
                    <h3 class="watchlist-title">${item.title}</h3>
                    <div class="watchlist-meta">
                        <span class="watchlist-year">📅 ${item.year}</span>
                        <span class="watchlist-rating">⭐ ${item.rating}</span>
                    </div>
                    <div class="watchlist-review-hint">Click for personal review</div>
                </div>
            </div>
        `).join('');
    }

    function showReview(tab, index) {
        const item = watchlistData[tab][index];
        
        // Create modal dynamically
        const modal = document.createElement('div');
        modal.className = 'wl-modal-overlay active';
        modal.innerHTML = `
            <div class="wl-modal">
                <button class="wl-modal-close" onclick="this.closest('.wl-modal-overlay').remove(); document.body.style.overflow = '';">×</button>
                <div class="wl-modal-img-wrap">
                    <img src="${item.image}" alt="${item.title}" onerror="this.style.display='none'">
                </div>
                <div class="wl-modal-body">
                    <h3>${item.title}</h3>
                    <div class="wl-modal-meta">
                        <span>📅 ${item.year}</span>
                        <span>⭐ ${item.rating}</span>
                        <span>🎬 ${tab.charAt(0).toUpperCase() + tab.slice(1)}</span>
                    </div>
                    <div class="wl-modal-review">
                        <h4>📝 Personal Review</h4>
                        <p>${item.review || "Review coming soon..."}</p>
                    </div>
                </div>
            </div>
        `;
        
        // Close on background click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.remove();
                document.body.style.overflow = '';
            }
        });
        
        document.body.appendChild(modal);
        document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    // Initialize watchlist on load
    document.addEventListener('DOMContentLoaded', () => {
        renderWatchlist();
    });
</script>
</body>
</html>
